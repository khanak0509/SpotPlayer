services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DOWNLOAD_WORKERS: "6"
      PORT: "8000"
      HOST_IP: ${HOST_IP:-}
      DATA_DIR: /data
      TEMP_DIR: /data/audio
    volumes:
      - spotplayer_data:/data

volumes:
  spotplayer_data:
