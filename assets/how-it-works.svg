<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .card { fill: #16161c; stroke: #2a2a33; stroke-width: 1.5; }
    .title { fill: #f2f2f5; font-size: 17px; font-weight: 700; }
    .sub { fill: #9a9aa6; font-size: 13px; }
    .line { stroke: #2f2f3a; stroke-width: 3; stroke-linecap: round; }
    .dot { fill: #1ed760; }
    .pulse { fill: none; stroke: #1ed760; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 3s ease-out infinite; }
    .p2 { animation-delay: 1s; }
    .p3 { animation-delay: 2s; }
    .move1 { animation: move1 3s linear infinite; }
    .move2 { animation: move2 3s linear infinite; animation-delay: 1s; }
    .bar { fill: #1ed760; animation: fill 6s ease-in-out infinite; }
    .eq rect { fill: #1ed760; transform-box: fill-box; transform-origin: bottom; animation: eq 0.9s ease-in-out infinite alternate; }
    .eq rect:nth-child(2) { animation-delay: 0.2s; }
    .eq rect:nth-child(3) { animation-delay: 0.4s; }
    .eq rect:nth-child(4) { animation-delay: 0.1s; }
    @keyframes pulse { 0% { opacity: 0.9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.12); } }
    @keyframes move1 { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 60% { transform: translateX(46px); opacity: 1; } 70%, 100% { transform: translateX(46px); opacity: 0; } }
    @keyframes move2 { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 60% { transform: translateX(46px); opacity: 1; } 70%, 100% { transform: translateX(46px); opacity: 0; } }
    @keyframes fill { 0% { width: 0; } 80%, 100% { width: 180px; } }
    @keyframes eq { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
  </style>

  <rect width="860" height="260" rx="18" fill="#0b0b0e"/>

  <g transform="translate(30 50)">
    <rect class="card" width="220" height="160" rx="16"/>
    <rect class="pulse" width="220" height="160" rx="16"/>
    <text class="title" x="20" y="40">1. Paste a link</text>
    <text class="sub" x="20" y="64">Spotify playlist, album</text>
    <text class="sub" x="20" y="82">or track</text>
    <rect x="20" y="104" width="180" height="34" rx="10" fill="#22222b"/>
    <text x="32" y="126" fill="#1ed760" font-size="12.5">open.spotify.com/playlist/…</text>
  </g>

  <line class="line" x1="260" y1="130" x2="310" y2="130"/>
  <circle class="dot move1" cx="262" cy="130" r="6"/>

  <g transform="translate(320 50)">
    <rect class="card" width="220" height="160" rx="16"/>
    <rect class="pulse p2" width="220" height="160" rx="16"/>
    <text class="title" x="20" y="40">2. Backend downloads</text>
    <text class="sub" x="20" y="64">Finds the best match on</text>
    <text class="sub" x="20" y="82">YouTube, saves MP3s</text>
    <rect x="20" y="108" width="180" height="10" rx="5" fill="#22222b"/>
    <rect class="bar" x="20" y="108" width="0" height="10" rx="5"/>
    <text class="sub" x="20" y="140">Syncing to your phone…</text>
  </g>

  <line class="line" x1="550" y1="130" x2="600" y2="130"/>
  <circle class="dot move2" cx="552" cy="130" r="6"/>

  <g transform="translate(610 50)">
    <rect class="card" width="220" height="160" rx="16"/>
    <rect class="pulse p3" width="220" height="160" rx="16"/>
    <text class="title" x="20" y="40">3. Play offline</text>
    <text class="sub" x="20" y="64">No internet, no ads,</text>
    <text class="sub" x="20" y="82">no subscription</text>
    <g class="eq" transform="translate(20 108)">
      <rect x="0" y="0" width="8" height="30" rx="3"/>
      <rect x="14" y="0" width="8" height="30" rx="3"/>
      <rect x="28" y="0" width="8" height="30" rx="3"/>
      <rect x="42" y="0" width="8" height="30" rx="3"/>
    </g>
    <text class="sub" x="80" y="130">Now playing</text>
  </g>
</svg>
